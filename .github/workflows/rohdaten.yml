name: Rohdaten herunterladen

# Lädt die Original-Dateien von BAG/priminfo und opendata.swiss in den Branch "rohdaten",
# damit sie geprüft und lokal verarbeitet werden können.
on:
  workflow_dispatch:
  schedule:
    # Das BAG publiziert die genehmigten Prämien fürs Folgejahr jeweils Ende September
    # (Kündigungsfrist 30. November). Rund um die Publikation täglich prüfen,
    # sonst monatlich (für nachträgliche Korrekturen wie 2024).
    - cron: "17 4 15-30 9 *"          # 15.–30. September täglich
    - cron: "17 4 * 10 *"             # Oktober täglich
    - cron: "17 4 1 1-8,11,12 *"      # übrige Monate am 1.

permissions:
  contents: write

jobs:
  laden:
    runs-on: ubuntu-latest
    steps:
      - name: Dateien laden
        run: |
          set -u
          mkdir -p roh && cd roh
          hole() { curl -fsSL --retry 3 -A "praemienradar" -o "$2" "$1" && echo "OK  $2 ($(du -h "$2" | cut -f1))" || echo "FEHLT $1"; }

          J=$(date +%Y); M=$(date +%-m)
          [ "$M" -ge 9 ] && N=$((J+1)) || N=$J   # ab September gilt das Folgejahr als aktuell
          for j in $N $((N-1)); do
            for u in "praemienregionen-$j.xlsx" "praemienregionen_$j.xlsx"; do
              [ -f "praemienregionen-$j.xlsx" ] || hole "https://www.priminfo.admin.ch/downloads/$u" "praemienregionen-$j.xlsx" || true
            done
          done
          find . -maxdepth 1 -type f -size 0 -delete
          for j in $J $((J-1)); do
            for m in 12 11 10 09 08 07 06 05 04 03 02 01 01-01; do
              [ -f versicherer.xlsx ] && break 2
              curl -fsSL -A "praemienradar" -o versicherer.xlsx "https://www.priminfo.admin.ch/downloads/zugelassene-krankenversicherer-$j-$m.xlsx" 2>/dev/null && echo "OK versicherer $j-$m" || rm -f versicherer.xlsx
            done
          done

          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          for api in "https://ckan.opendata.swiss/api/3/action/package_show?id=health-insurance-premiums" \
                     "https://opendata.swiss/api/3/action/package_show?id=health-insurance-premiums" \
                     "https://ckan.opendata.swiss/api/3/action/package_search?q=Krankenversicherungspr%C3%A4mien"; do
            if curl -fsSL --retry 2 -A "$UA" -H "Accept: application/json" -o ckan.json "$api"; then echo "API OK $api"; break; else echo "API FEHLT $api"; fi
          done
          [ -s ckan.json ] || { echo "Keine CKAN-Antwort"; echo '{"result":{"resources":[]}}' > ckan.json; }
          python3 - <<'EOF'
          import json, subprocess
          d = json.load(open("ckan.json"))["result"]
          if "results" in d:
              d = next((x for x in d["results"] if "premium" in x.get("name","") or "praem" in x.get("name","")), {"resources": []})
              print("PAKET", d.get("name"))
          res = d["resources"]
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          for r in res:
              name = r.get("name")
              if isinstance(name, dict):
                  name = name.get("de") or name.get("en") or next(iter(name.values()), "")
              url = r.get("download_url") or r.get("url")
              print("RES", name, url, r.get("modified") or r.get("last_modified") or r.get("issued"))
              if name and (name.lower().endswith(".csv") and "_ch" in name.lower() and "pr" in name.lower()
                           or name.startswith("Archiv_Praemien_") or name.startswith("Erläuterungen")
                           or name in ("Einzugsgebiete.csv", "Tarife.csv")):
                  rc = subprocess.run(["curl", "-fsSL", "--retry", "3", "-A", UA, "-o", name, url]).returncode
                  print("DL", "OK" if rc == 0 else f"FEHLT({rc})", name)
          EOF
          ls -la

      - name: Prüfen, packen und in Branch rohdaten pushen
        run: |
          cd roh
          # Archive: je Jahr (ab 2018) nur Schweizer Prämien + Einzugsgebiete behalten
          pip install -q pandas openpyxl
          for z in Archiv_Praemien_*.zip; do
            j=$(echo "$z" | grep -o '20[0-9][0-9]')
            if [ "$j" -ge 2018 ]; then
              echo "== $z"; unzip -Z1 "$z" | sed 's/^/   /'
              mkdir -p "x$j" && unzip -q -o "$z" -d "x$j"
              # verschachtelte ZIPs ebenfalls entpacken
              find "x$j" -iname '*.zip' -exec unzip -q -o {} -d "x$j" \;
              f=$(find "x$j" -iname 'pr*mien*ch*.csv' ! -iname '*eu*' | LC_ALL=C sort | head -1)
              if [ -z "$f" ]; then
                x=$(find "x$j" -iname 'pr*mien*ch*.xls*' ! -iname '*eu*' | LC_ALL=C sort | head -1)
                [ -n "$x" ] && python3 -c "import pandas as pd,sys; pd.read_excel(sys.argv[1],dtype=str).to_csv(sys.argv[2],index=False)" "$x" "x$j/conv.csv" && f="x$j/conv.csv"
              fi
              [ -n "$f" ] && cp "$f" "praemien_$j.csv" && echo "  -> praemien_$j.csv aus $f"
              e=$(find "x$j" -iname 'einzugsgebiete*.csv' | LC_ALL=C sort | head -1)
              [ -n "$e" ] && cp "$e" "einzugsgebiete_$j.csv"
              rm -rf "x$j"
            fi
            rm "$z"
          done
          [ -f Einzugsgebiete.csv ] && mv Einzugsgebiete.csv einzugsgebiete_aktuell.csv
          [ -f "Prämien_CH.csv" ] && mv "Prämien_CH.csv" "praemien_aktuell.csv"

          # Sperre: ohne vollständigen Datensatz nichts überschreiben
          for pflicht in praemien_aktuell.csv versicherer.xlsx; do
            [ -s "$pflicht" ] || { echo "::error::$pflicht fehlt – bestehende Rohdaten bleiben unverändert."; exit 1; }
          done
          ls praemienregionen-*.xlsx >/dev/null 2>&1 || { echo "::error::Prämienregionen fehlen – bestehende Rohdaten bleiben unverändert."; exit 1; }
          [ "$(ls praemien_20*.csv 2>/dev/null | wc -l)" -ge 5 ] || { echo "::error::Zu wenige Archivjahre – bestehende Rohdaten bleiben unverändert."; exit 1; }

          # Prüfsumme über den Inhalt; nur bei Änderungen hochladen
          sha256sum *.csv *.xlsx | sort -k2 > pruefsumme.txt
          echo "Neues Prämienjahr: $(head -2 praemien_aktuell.csv | tail -1 | cut -d, -f4)"
          for f in *.csv; do zip -q -9 "$f.zip" "$f" && rm "$f"; done
          ls -la
          REPO="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git init -q -b rohdaten
          git config user.name "praemienradar-bot"
          git config user.email "actions@users.noreply.github.com"
          if git fetch --depth 1 "$REPO" rohdaten && git show FETCH_HEAD:pruefsumme.txt > alt.txt 2>/dev/null; then
            if cmp -s alt.txt pruefsumme.txt; then
              echo "Rohdaten unverändert – nichts zu tun."
              exit 0
            fi
            echo "Geänderte Dateien:"; diff alt.txt pruefsumme.txt | grep '^>' | awk '{print "  " $3, $4, $5, $6}'
          else
            echo "Noch keine Prüfsumme im Branch."
          fi
          rm -f alt.txt
          git add -A
          git commit -q -m "Rohdaten $(date +%F)"
          git push -f "$REPO" rohdaten
          echo "Rohdaten aktualisiert."
