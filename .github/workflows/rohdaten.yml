name: Rohdaten herunterladen

# Lädt die Original-Dateien von BAG/priminfo und opendata.swiss in den Branch "rohdaten",
# damit sie geprüft und lokal verarbeitet werden können.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  laden:
    runs-on: ubuntu-latest
    steps:
      - name: Dateien laden
        run: |
          set -u
          mkdir -p roh && cd roh
          hole() { curl -fsSL --retry 3 -A "praemienradar" -o "$2" "$1" && echo "OK  $2 ($(du -h "$2" | cut -f1))" || echo "FEHLT $1"; }

          hole https://www.priminfo.admin.ch/downloads/praemienregionen-2027.xlsx praemienregionen-2027.xlsx
          hole https://www.priminfo.admin.ch/downloads/praemienregionen_2026.xlsx praemienregionen-2026.xlsx
          hole https://www.priminfo.admin.ch/downloads/zugelassene-krankenversicherer-2026-10.xlsx versicherer.xlsx

          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          for api in "https://ckan.opendata.swiss/api/3/action/package_show?id=health-insurance-premiums" \
                     "https://opendata.swiss/api/3/action/package_show?id=health-insurance-premiums" \
                     "https://ckan.opendata.swiss/api/3/action/package_search?q=Krankenversicherungspr%C3%A4mien"; do
            if curl -fsSL --retry 2 -A "$UA" -H "Accept: application/json" -o ckan.json "$api"; then echo "API OK $api"; break; else echo "API FEHLT $api"; fi
          done
          [ -s ckan.json ] || { echo "Keine CKAN-Antwort"; echo '{"result":{"resources":[]}}' > ckan.json; }
          python3 - <<'EOF'
          import json, subprocess
          d = json.load(open("ckan.json"))["result"]
          if "results" in d:
              d = next((x for x in d["results"] if "premium" in x.get("name","") or "praem" in x.get("name","")), {"resources": []})
              print("PAKET", d.get("name"))
          res = d["resources"]
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          for r in res:
              name = r.get("name")
              if isinstance(name, dict):
                  name = name.get("de") or name.get("en") or next(iter(name.values()), "")
              url = r.get("download_url") or r.get("url")
              print("RES", name, url, r.get("modified") or r.get("last_modified") or r.get("issued"))
              if name and (name.lower().endswith(".csv") and "_ch" in name.lower() and "pr" in name.lower()
                           or name.startswith("Archiv_Praemien_") or name.startswith("Erläuterungen")
                           or name in ("Einzugsgebiete.csv", "Tarife.csv")):
                  rc = subprocess.run(["curl", "-fsSL", "--retry", "3", "-A", UA, "-o", name, url]).returncode
                  print("DL", "OK" if rc == 0 else f"FEHLT({rc})", name)
          EOF
          ls -la

      - name: Grosse CSV packen und in Branch rohdaten pushen
        if: always()
        run: |
          cd roh
          # Archive: je Jahr (ab 2018) nur Schweizer Prämien + Einzugsgebiete behalten
          pip install -q pandas openpyxl
          for z in Archiv_Praemien_*.zip; do
            j=$(echo "$z" | grep -o '20[0-9][0-9]')
            if [ "$j" -ge 2018 ]; then
              echo "== $z"; unzip -Z1 "$z" | sed 's/^/   /'
              mkdir -p "x$j" && unzip -q -o "$z" -d "x$j"
              # verschachtelte ZIPs ebenfalls entpacken
              find "x$j" -iname '*.zip' -exec unzip -q -o {} -d "x$j" \;
              f=$(find "x$j" -iname 'pr*mien*ch*.csv' ! -iname '*eu*' | head -1)
              if [ -z "$f" ]; then
                x=$(find "x$j" -iname 'pr*mien*ch*.xls*' ! -iname '*eu*' | head -1)
                [ -n "$x" ] && python3 -c "import pandas as pd,sys; pd.read_excel(sys.argv[1],dtype=str).to_csv(sys.argv[2],index=False)" "$x" "x$j/conv.csv" && f="x$j/conv.csv"
              fi
              [ -n "$f" ] && cp "$f" "praemien_$j.csv" && echo "  -> praemien_$j.csv aus $f"
              e=$(find "x$j" -iname 'einzugsgebiete*.csv' | head -1)
              [ -n "$e" ] && cp "$e" "einzugsgebiete_$j.csv"
              rm -rf "x$j"
            fi
            rm "$z"
          done
          [ -f Einzugsgebiete.csv ] && mv Einzugsgebiete.csv einzugsgebiete_aktuell.csv
          mv "Prämien_CH.csv" "praemien_aktuell.csv"
          for f in *.csv; do zip -q -9 "$f.zip" "$f" && rm "$f"; done
          ls -la
          git init -q -b rohdaten
          git config user.name "praemienradar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Rohdaten $(date +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" rohdaten
