name: Prämiendaten aktualisieren

# Läuft automatisch, sobald "Rohdaten herunterladen" erfolgreich war (oder manuell):
# baut aus dem Branch "rohdaten" die JSON-Dateien der Webseite neu und committet sie.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Rohdaten herunterladen"]
    types: [completed]

permissions:
  contents: write

jobs:
  bauen:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: pip install pandas openpyxl

      - name: Rohdaten holen
        run: |
          git fetch --depth 1 origin rohdaten
          mkdir -p data-src/roh
          git archive origin/rohdaten | tar -x -C data-src/roh
          ls -la data-src/roh

      - name: JSON bauen
        run: python scripts/build_data.py

      - name: Plausibilität prüfen
        run: |
          python3 - <<'EOF'
          import json, glob, sys
          m = json.load(open("docs/data/meta.json"))
          regionen = glob.glob("docs/data/p/*.json")
          print("Jahre", m["jahre"], "| Kassen aktiv", len(m["aktiv"]), "| Regionen", len(regionen))
          if len(regionen) < 40 or len(m["aktiv"]) < 20 or len(m["jahre"]) < 5:
              sys.exit("Unplausible Daten – nicht veröffentlichen.")
          EOF

      - name: Änderungen committen
        run: |
          git config user.name "praemienradar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && echo "Keine Änderungen." && exit 0
          git commit -m "Prämiendaten aktualisiert ($(date +%F))"
          git push
